# Redeploys lab.nawi.dev when this project's main changes: the lab's build downloads every project's latest main.
name: notify lab
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy-lab:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the lab's Vercel deploy hook
        env:
          HOOK: ${{ secrets.LAB_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK"
